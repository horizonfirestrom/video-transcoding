# ===============================
# Basic server settings
# ===============================
server.port=8080

# ===============================
# MySQL datasource config
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/cloud_video_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=january123

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# To see SQL in logs with parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE


spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
